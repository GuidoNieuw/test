<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takenlijst — testapp</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-dark: #0ea5e9;
    --done: #475569;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    overflow-x: hidden;
    position: relative;
  }
  .blobs {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    animation: float 16s ease-in-out infinite;
  }
  .blob:nth-child(1) {
    width: 280px;
    height: 280px;
    background: var(--accent);
    top: -60px;
    left: -60px;
    animation-duration: 18s;
  }
  .blob:nth-child(2) {
    width: 220px;
    height: 220px;
    background: #a78bfa;
    bottom: -40px;
    right: -40px;
    animation-duration: 22s;
    animation-delay: -6s;
  }
  .blob:nth-child(3) {
    width: 180px;
    height: 180px;
    background: #34d399;
    top: 40%;
    right: 10%;
    animation-duration: 14s;
    animation-delay: -3s;
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(30px, 40px) scale(1.1); }
    50% { transform: translate(-20px, 20px) scale(0.95); }
    75% { transform: translate(20px, -30px) scale(1.05); }
  }
  #confetti {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }
  .app {
    width: 100%;
    max-width: 460px;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  p.sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 0.95rem;
  }
  input[type="text"]:focus {
    outline: 2px solid var(--accent);
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.95rem;
    cursor: pointer;
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
  }
  button:hover { background: var(--accent-dark); }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  li span {
    flex: 1;
    word-break: break-word;
  }
  li.done span {
    color: var(--done);
    text-decoration: line-through;
  }
  li.just-added {
    animation: pop-in 0.35s ease;
  }
  @keyframes pop-in {
    0% { transform: scale(0.9) translateY(-6px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  li.just-done {
    animation: wiggle 0.4s ease;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-2deg); }
    75% { transform: rotate(2deg); }
  }
  li button.remove {
    background: transparent;
    color: var(--danger);
    font-weight: 700;
    padding: 4px 8px;
  }
  li button.remove:hover { background: rgba(248, 113, 113, 0.15); }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 20px 0;
    font-size: 0.9rem;
  }
  footer {
    margin-top: 16px;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="blobs">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
  </div>
  <canvas id="confetti"></canvas>
  <div class="app">
    <h1>Takenlijst</h1>
    <p class="sub">Testapp om te ontdekken hoe Claude Code werkt — voeg taken toe, vink ze af, verwijder ze.</p>
    <div class="card">
      <form id="add-form">
        <input type="text" id="task-input" placeholder="Nieuwe taak..." autocomplete="off" />
        <button type="submit">Toevoegen</button>
      </form>
      <ul id="task-list"></ul>
      <p class="empty" id="empty-msg">Nog geen taken. Voeg er een toe!</p>
    </div>
    <footer>Data wordt lokaal opgeslagen in je browser (localStorage).</footer>
  </div>

  <script>
    const STORAGE_KEY = "test-app-tasks";
    const form = document.getElementById("add-form");
    const input = document.getElementById("task-input");
    const list = document.getElementById("task-list");
    const emptyMsg = document.getElementById("empty-msg");

    // --- Confetti: leuke visuele feedback bij acties ---
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    const colors = ["#38bdf8", "#a78bfa", "#34d399", "#fbbf24", "#f87171"];
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function burst(x, y, count = 24) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          size: 4 + Math.random() * 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          spin: (Math.random() - 0.5) * 20,
          life: 1,
        });
      }
      if (!animating) {
        animating = true;
        requestAnimationFrame(tick);
      }
    }

    let animating = false;
    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p) => {
        p.vy += 0.12;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.spin;
        p.life -= 0.015;

        ctx.save();
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });
      particles = particles.filter((p) => p.life > 0);

      if (particles.length > 0) {
        requestAnimationFrame(tick);
      } else {
        animating = false;
      }
    }

    function burstFromElement(el, count) {
      const rect = el.getBoundingClientRect();
      burst(rect.left + rect.width / 2, rect.top + rect.height / 2, count);
    }

    function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTasks(tasks) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    let tasks = loadTasks();
    let justAddedIndex = null;

    function render() {
      list.innerHTML = "";
      emptyMsg.style.display = tasks.length ? "none" : "block";

      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("done");
        if (index === justAddedIndex) li.classList.add("just-added");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.addEventListener("change", () => {
          tasks[index].done = checkbox.checked;
          saveTasks(tasks);
          if (checkbox.checked) {
            burstFromElement(checkbox, 30);
            li.classList.add("just-done");
          }
          render();
        });

        const span = document.createElement("span");
        span.textContent = task.text;

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove";
        removeBtn.textContent = "✕";
        removeBtn.addEventListener("click", () => {
          tasks.splice(index, 1);
          saveTasks(tasks);
          render();
        });

        li.append(checkbox, span, removeBtn);
        list.appendChild(li);
      });

      justAddedIndex = null;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      saveTasks(tasks);
      justAddedIndex = tasks.length - 1;
      const submitBtn = form.querySelector("button");
      burstFromElement(submitBtn, 16);
      input.value = "";
      render();
    });

    render();
  </script>
</body>
</html>
